name: Windows

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  compile-test:
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - 3.4.1
          - 3.4.2
          - 3.4.3
          - 3.4.4
          - 3.4.5
          - 3.4.6
          - 3.4.7
          - 3.4.8
          - 4.0.0
          - 4.0.1
          - head

    steps:
    - uses: actions/checkout@v6

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Ensure required tools
      shell: pwsh
      run: |
        if (Get-Command ridk -ErrorAction SilentlyContinue) {
          ridk exec pacman -S --noconfirm --needed patch msys2-devel
        }
        if (-not (Get-Command patch -ErrorAction SilentlyContinue)) {
          choco install patch -y
        }
        patch --version
        curl --version
        tar --version

    - name: Install dependencies
      run: bundle install

    - name: Build Kanayago
      run: bundle exec rake compile

    - name: Run tests
      run: bundle exec rake test

  gem-build-install:
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - 3.4
          - 4.0
          - head

    steps:
    - uses: actions/checkout@v6

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Ensure required tools
      shell: pwsh
      run: |
        if (Get-Command ridk -ErrorAction SilentlyContinue) {
          ridk exec pacman -S --noconfirm --needed patch msys2-devel
        }
        if (-not (Get-Command patch -ErrorAction SilentlyContinue)) {
          choco install patch -y
        }
        patch --version
        curl --version
        tar --version

    - name: Install dependencies
      run: bundle install

    - name: Build gem
      run: bundle exec rake build

    - name: Install built gem
      shell: pwsh
      run: |
        $gem = (Get-ChildItem -Path pkg -Filter 'kanayago-*.gem' | Select-Object -First 1).FullName
        if (-not $gem) {
          throw 'Built gem not found in pkg/'
        }
        gem install $gem

  gem-rake-install:
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - 3.4
          - 4.0
          - head

    steps:
    - uses: actions/checkout@v6

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Ensure required tools
      shell: pwsh
      run: |
        if (Get-Command ridk -ErrorAction SilentlyContinue) {
          ridk exec pacman -S --noconfirm --needed patch msys2-devel
        }
        if (-not (Get-Command patch -ErrorAction SilentlyContinue)) {
          choco install patch -y
        }
        patch --version
        curl --version
        tar --version

    - name: Install dependencies
      run: bundle install

    - name: Rake install
      run: bundle exec rake install
