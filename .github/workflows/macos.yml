name: macOS

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  compile-test:
    runs-on: macos-14

    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - 3.4.0
          - 3.4.1
          - 3.4.2
          - 3.4.3
          - 3.4.4
          - 3.4.5
          - 3.4.6
          - 3.4.7
          - 3.4.8
          - 3.4.9
          - 4.0.0
          - 4.0.1
          - 4.0.2
          - 4.0.3
          - 4.0.4

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: brew install openssl readline libyaml gdbm

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Setup Kanayago
      run: bin/setup

    - name: Build Kanayago
      run: bundle exec rake compile

    - name: Run tests
      run: bundle exec rake queue:test

  gem-build-install:
    runs-on: macos-14

    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - 3.4
          - 4.0

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: brew install openssl readline libyaml gdbm

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Kanayago gem build and install
      run: bundle exec rake build && gem install ./pkg/kanayago-*.gem

  gem-rake-install:
    runs-on: macos-14

    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - 3.4
          - 4.0

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: brew install openssl readline libyaml gdbm

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Kanayago gem install
      run: bundle exec rake install
