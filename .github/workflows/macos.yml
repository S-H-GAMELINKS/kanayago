name: macOS

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: macos-14

    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - 3.4
          - head

    steps:
    - uses: actions/checkout@v6

    - name: Install dependencies
      run: brew install openssl readline libyaml gdbm

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Setup Kanayago
      run: bin/setup

    - name: Build Kanayago
      run: bundle exec rake compile

    - name: Run tests
      run: bundle exec rake test
