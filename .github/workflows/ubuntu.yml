name: Ubuntu

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt install git ruby autoconf gcc make zlib1g-dev libffi-dev libreadline-dev libgdbm-dev libssl-dev libyaml-dev -y

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: head
        bundler-cache: true

    - name: Import Ruby Parser
      run: bundle exec rake ruby_parser:import

    - name: Patch to Ruby Parser
      run: bundle exec rake ruby_parser:patch

    - name: Build Kanayago
      run: bundle exec rake compile

    - name: Run tests
      run: bundle exec rake queue:test

